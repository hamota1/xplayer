name: Build Native XPlayer Clone & Full Merged APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-clone:
    name: Build Native Android Clone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Android App
        run: |
          cd android-project
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Output
        run: |
          mkdir -p output
          cp android-project/app/build/outputs/apk/debug/*.apk output/XPlayer-Native-Clone.apk
          echo "Native APK built successfully."

      - name: Upload Native Clone APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlayer-Native-Clone-APK
          path: output/XPlayer-Native-Clone.apk
          retention-days: 30

      - name: Publish Release with Native Clone
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-native
          name: "XPlayer Native Android Clone v2.0 (Full Features & Clean)"
          body: |
            ### 🚀 XPlayer Native Android Clone (100% Native & Clean)
            نسخة الكلون الأصلية الكاملة المبنية بنظام أندرويد الأصلي (Native Java + ExoPlayer):
            
            - 📁 **فحص وتشغيل ملفات الهاتف:** قراءة كافة مقاطع الفيديو الموجودة على ذاكرة الهاتف والميموري كارد تلقائياً.
            - 🖐️ **نظام الإيماءات الكامل:**
              - سحب عمودي على اليسار: التحكم في السطوع مع مؤشر HUD.
              - سحب عمودي على اليمين: التحكم في الصوت مع مؤشر HUD.
              - سحب أفقي: تقديم وتأخير مع شاشة عرض التوقيت الدقيق.
              - نقر مزدوج: قفز 10 ثوانٍ للأمام والخلف.
            - 🎚️ **معادل صوتي أصلي (Native AudioFx Equalizer):** 5 نطاقات ترددات حقيقية مع Bass Boost ومؤثرات صوتية.
            - 🔒 **الخزنة السرية (Private Vault):** قفل برمز PIN مكون من 4 أرقام وإخفاء الفيديوهات بملف `.nomedia`.
            - 🪟 **النافذة العائمة (Picture-in-Picture):** دعم كامل لخاصية PiP والتشغيل أثناء تصفح التطبيقات الأخرى.
            - ⚡ **فك تشفير عتادي فائق (ExoPlayer):** دعم 4K Ultra HD، والتحكم بنسب العرض (Fit, Crop, Fill) وسرعة التشغيل (0.5x حتى 2.0x).
            - 🚫 **خالٍ تماماً من أي إعلانات:** بدون إعلانات مزعجة وبأعلى سرعة ممكنة.
          files: output/XPlayer-Native-Clone.apk
        continue-on-error: true
