name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd android-project
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Rename APK
        run: |
          mkdir -p output
          cp android-project/app/build/outputs/apk/debug/*.apk output/XPlayer-Clone-debug.apk
          echo "APK generated successfully at output/XPlayer-Clone-debug.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPlayer-Clone-APK
          path: output/XPlayer-Clone-debug.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "XPlayer Clone v1.0.${{ github.run_number }} (Direct APK)"
          body: |
            ### 📱 XPlayer Clone APK Download
            تم تجميع وتوليد ملف الـ APK بنجاح وبشكل تلقائي عبر GitHub Actions!
            
            - **اسم الملف:** `XPlayer-Clone-debug.apk`
            - **طريقة التثبيت:** قم بتنزيل الملف المرفق أدناه وتثبيته مباشرة على هاتفك الأندرويد.
          files: output/XPlayer-Clone-debug.apk
        continue-on-error: true
