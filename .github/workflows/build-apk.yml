name: Merge & Build Full XPlayer APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-apk:
    name: Merge Split APKs into Full Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download APKEditor and Uber-APK-Signer
        run: |
          mkdir -p tools
          curl -L -o tools/APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          curl -L -o tools/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          chmod +x tools/*.jar

      - name: Merge Split APKs with APKEditor
        run: |
          mkdir -p build_output
          echo "Merging split APKs from splits/ directory..."
          java -jar tools/APKEditor.jar m -i splits -o build_output/XPlayer_Merged_Unsigned.apk

      - name: Sign Merged APK with Uber-APK-Signer
        run: |
          java -jar tools/uber-apk-signer.jar --apks build_output/XPlayer_Merged_Unsigned.apk -o build_output/signed --allowResign
          # Locate signed apk
          SIGNED_APK=$(find build_output/signed -name "*aligned-debugSigned.apk" -o -name "*.apk" | head -n 1)
          cp "$SIGNED_APK" build_output/XPlayer-Full-Merged.apk
          echo "Signed APK ready: build_output/XPlayer-Full-Merged.apk"

      - name: Upload Full Merged APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPlayer-Full-Merged-APK
          path: build_output/XPlayer-Full-Merged.apk
          retention-days: 30

      - name: Create GitHub Release with Full APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3-full
          name: "XPlayer (Video Player All Format) v1.6.3 Full Standalone APK"
          body: |
            ### 🎬 XPlayer Full Standalone APK (100% Native Features)
            تم دمج حزم الـ Split APK وتوليد النسخة الكاملة الأصلية من **XPlayer**:
            
            - **المميزات الكاملة:**
              - مشغل الفيديو بكافة الصيغ (MKV, MP4, M4V, AVI, MOV, 3GP, FLV, WMV, RMVB, TS).
              - فك تشفير وتسريع عتادي فائق بدقة 4K Ultra HD.
              - كافة مكتبات المعالجة الأصلية (FFmpeg, IjkPlayer, codecs).
              - الخزنة السرية (Private Vault).
              - المعادل الصوتي ومضخم الصوت الجهير.
              - التحكم بالإيماءات الكاملة (السطوع، الصوت، والتقديم).
              - النافذة العائمة (Picture-in-Picture) والتشغيل في الخلفية.
            
            📥 **رابط التحميل المباشر أدناه:** قم بتنزيل ملف `XPlayer-Full-Merged.apk` وتثبيته مباشرة على هاتفك الأندرويد.
          files: build_output/XPlayer-Full-Merged.apk
        continue-on-error: true
